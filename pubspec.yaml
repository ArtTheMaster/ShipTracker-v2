name: gjandasher_shiptracker
description: "A Mobile Outbound Logistics, Analytics, and Returns Manager for Customized Motorcycle Plates."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Permissions & System
  permission_handler: ^11.3.1

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # Firebase Core Suite
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  google_sign_in: ^6.2.2

  # Hardware, Camera & Scanner
  mobile_scanner: ^7.3.0
  image_picker: ^1.2.4
  flutter_image_compress: ^2.3.0

  # Network, Caching & HTTP
  connectivity_plus: ^7.3.2
  cached_network_image: ^3.3.1
  http: ^1.6.0

  # Analytics & Visualization (Module 6 & 7)
  fl_chart: ^1.2.0

  # Module 8: Organized Excel Export, File System & Native Sharing
  excel: ^4.0.3
  path_provider: ^2.1.3
  share_plus: ^10.0.0

  # Local Cache & Utilities
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.3

  # Formatting & Fonts
  intl: ^0.19.0
  google_fonts: ^6.2.1
  firebase_messaging: ^14.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Asset Declarations
  assets:
    - assets/images/